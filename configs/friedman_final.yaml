# Final experiment configuration — full RF, validation-tuned k and tau.

dataset:
  name: friedman1
  n_samples: 500
  n_noise: 20
  random_state: 42

model:
  d: 5
  bandwidth: auto
  # k and tau below are INITIAL values; when tuning.enabled is true,
  # they are overridden by the validation-selected values before fitting.
  k: 20
  tau: 0.1
  max_iters: 300
  tol: 1.0e-6
  ridge_lambda: 0.01
  init_method: pca
  random_state: 42

random_forest:
  n_estimators: 500
  max_depth: null
  min_samples_leaf: 5
  max_features: sqrt
  random_state: 42

crossfit:
  n_splits: 5
  shuffle: true
  random_state: 42

evaluation:
  # Second-stage models applied to Z = X @ B after B is learned by MAVE/SP-MAVE.
  # These estimate g in Y ≈ g(B^T X); they do NOT replace the MAVE estimator.
  downstream_models:
    - linear
    - kernel_ridge
    - random_forest
  metrics:
    - projection_distance
    - grassmann_distance
    - vector_correlation
    - test_mse
  save_figures: true

split:
  test_size: 0.3
  random_state: 42

methods:
  - classical_mave
  - classical_mave_topk
  - sp_mave

# Validation-based tuning for SP-MAVE's k and tau.
tuning:
  enabled: true
  val_size: 0.2
  k_candidates: [10, 15, 20, 25, 30, 40]
  tau_candidates: [0.5, 1.0, 2.0]
  random_state: 42
  max_iters: 50    # faster iterations for hyperparameter search

# Run the experiment across multiple random seeds for statistical robustness.
# Each seed regenerates the dataset and train/test split.
# Tuning is repeated within each seed's training data (no optimistic bias).
multi_seed:
  enabled: true
  n_seeds: 20
