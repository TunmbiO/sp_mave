# Semi-synthetic y on real California housing features (train-only scaling inside split).
# Outputs: results/mave/semi_synthetic/california_housing/
#
# B_true: orthonormal p×d from QR of N(0,1) with b_true_seed.
# y = g_friedman_adapted(Z) + N(0, noise_std^2) on train/test separately after scaling.

dataset:
  name: semi_synthetic_real_x
  base: california_housing
  max_samples: 2500
  random_state: 42
  d_true: 3
  b_true_seed: 42
  noise_std: 0.5

model:
  d: 3
  bandwidth: auto
  k: 20
  tau: 0.5
  max_iters: 100
  tol: 1.0e-6
  ridge_lambda: 0.01
  init_method: pca
  random_state: 42

random_forest:
  n_estimators: 200
  max_depth: null
  min_samples_leaf: 5
  max_features: sqrt
  random_state: 42

crossfit:
  n_splits: 5
  shuffle: true
  random_state: 42

evaluation:
  downstream_models:
    - linear
    - random_forest
  metrics:
    - projection_distance
    - grassmann_distance
    - vector_correlation
    - test_mse
  save_figures: true

split:
  test_size: 0.3
  random_state: 42

methods:
  - classical_mave
  - classical_mave_topk
  - sp_mave

tuning:
  enabled: true
  val_size: 0.2
  k_candidates: [10, 15, 20, 25, 30, 40]
  tau_candidates: [0.5, 1.0, 2.0]
  random_state: 42
  max_iters: 40
  matched_k_for_classical_topk: true
  tune_classical_topk_k: false

multi_seed:
  enabled: true
  n_seeds: 10

experiment:
  results_track: semi_synthetic
  results_slug: california_housing
  paper_plots: true
