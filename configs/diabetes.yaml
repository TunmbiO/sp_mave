# Diabetes dataset — sklearn built-in (442 samples, 10 features).
# No ground-truth subspace; evaluation is purely predictive.

dataset:
  name: diabetes

model:
  d: 3
  bandwidth: auto
  k: 20
  tau: 0.1
  max_iters: 200
  tol: 1.0e-6
  ridge_lambda: 0.01
  init_method: pca
  random_state: 42

random_forest:
  n_estimators: 500
  max_depth: null
  min_samples_leaf: 5
  max_features: sqrt
  random_state: 42

crossfit:
  n_splits: 5
  shuffle: true
  random_state: 42

evaluation:
  downstream_models:
    - linear
    - kernel_ridge
    - random_forest
  metrics:
    - test_mse
  save_figures: true

split:
  test_size: 0.3
  random_state: 42

methods:
  - classical_mave
  - classical_mave_topk
  - sp_mave

tuning:
  enabled: true
  val_size: 0.2
  k_candidates: [10, 15, 20, 25, 30]
  tau_candidates: [0.5, 1.0, 2.0]
  random_state: 42
  max_iters: 50

multi_seed:
  enabled: true
  n_seeds: 10
