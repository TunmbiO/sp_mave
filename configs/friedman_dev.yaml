# Fast development config — small RF, few iterations, for debugging.

dataset:
  name: friedman1
  n_samples: 100
  n_noise: 20
  random_state: 42

model:
  d: 5
  bandwidth: auto
  k: 15
  tau: 0.1
  max_iters: 10
  tol: 1.0e-4
  ridge_lambda: 0.01
  init_method: pca
  random_state: 42

random_forest:
  n_estimators: 100
  max_depth: null
  min_samples_leaf: 5
  max_features: sqrt
  random_state: 42

crossfit:
  n_splits: 3
  shuffle: true
  random_state: 42

evaluation:
  downstream_model: linear
  metrics:
    - projection_distance
    - grassmann_distance
    - test_mse
  save_figures: true

split:
  test_size: 0.3
  random_state: 42

methods:
  - classical_mave
  - sp_mave

# Tuning disabled for fast dev iteration; use fixed k and tau above.
tuning:
  enabled: false
