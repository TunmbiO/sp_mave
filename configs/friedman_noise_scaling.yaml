# Friedman-1 only: sweep irrelevant dimensions (pure noise features).
# Run with:  python run_noise_scaling_experiment.py --config configs/friedman_noise_scaling.yaml
# Do not use with run_experiment.py (multi_seed is off; this file is for the noise sweep script).

dataset:
  name: friedman1
  n_samples: 500
  n_noise: 0
  noise: 1.0
  random_state: 42

model:
  d: 5
  bandwidth: auto
  k: 20
  tau: 0.1
  max_iters: 300
  tol: 1.0e-6
  ridge_lambda: 0.01
  init_method: pca
  random_state: 42

random_forest:
  n_estimators: 500
  max_depth: null
  min_samples_leaf: 5
  max_features: sqrt
  random_state: 42

crossfit:
  n_splits: 5
  shuffle: true
  random_state: 42

evaluation:
  downstream_models:
    - linear
    - kernel_ridge
    - random_forest
  metrics:
    - projection_distance
    - grassmann_distance
    - vector_correlation
    - test_mse
  save_figures: false

split:
  test_size: 0.3
  random_state: 42

methods:
  - classical_mave
  - classical_mave_topk
  - sp_mave

tuning:
  enabled: true
  val_size: 0.2
  k_candidates: [10, 15, 20, 25, 30, 40]
  tau_candidates: [0.5, 1.0, 2.0]
  random_state: 42
  max_iters: 50

multi_seed:
  enabled: false
  n_seeds: 1

# Grid and replication (read only by run_noise_scaling_experiment.py).
noise_scaling_experiment:
  noise_dims: [0, 10, 20, 40, 80, 120]
  n_seeds: 10
