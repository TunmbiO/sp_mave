[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sp_mave"
version = "0.1.0"
description = "Supervised Proximity MAVE for sufficient dimension reduction"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas",
]

[tool.setuptools]
packages = ["sp_mave"]
